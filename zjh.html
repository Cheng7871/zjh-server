<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联机炸金花</title>
    <style>
        * {box-sizing: border-box; font-family: sans-serif;}
        body {background: #182040; color:white; padding:16px; margin:0; position:relative;}
        .box {border:1px solid #778; border-radius:10px; padding:12px; margin-bottom:16px;}
        .cardWrap {display:flex; gap:8px; margin:10px 0;}
        .card {width:80px; height:110px; background:#223366; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold;}
        .card-back {background:#112244; color:transparent;}
        button {padding:14px 20px; font-size:17px; margin:4px; border:none; border-radius:6px; cursor:pointer;}
        button:disabled{
            background:#666;
            cursor:not-allowed;
        }
        input {padding:12px; font-size:17px; border-radius:6px; border:none; width:160px; margin:4px;}
        #countdown {
            font-size:72px;
            color:#ffcc00;
            text-align:center;
            font-weight:bold;
            margin:20px 0;
            text-shadow: 0 0 10px #ffcc00;
        }
        #secretBtn {
            position:fixed;
            right:12px;
            top:12px;
            width:42px;
            height:42px;
            border-radius:50%;
            font-size:22px;
            background:#334;
            color:#fff;
            border:1px solid #889;
        }
        .modal{
            display:flex;
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.75);
            align-items:center;
            justify-content:center;
        }
        .modal-box{
            background:#222844;
            padding:20px;
            border-radius:10px;
        }
        #selectModal{
            display:flex;
        }
        #resultModal{
            display:none;
            text-align:center;
        }
        .ws-status{
            position:fixed;
            bottom:10px;
            right:10px;
            padding:6px 10px;
            background:#222;
            border-radius:4px;
        }
    </style>
</head>
<body>
    <div class="ws-status" id="wsStatus">🔴 未连接服务</div>
    <h2>联机炸金花</h2>

    <div id="selectModal" class="modal">
        <div class="modal-box">
            <h3>输入身份：A 或者 B（也可以输入1=A，2=B）</h3>
            <input type="text" id="roleInput" placeholder="输入 A/B /1/2">
            <br>
            <button id="joinBtn" onclick="selectRole()" disabled>加入房间</button>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-box">
            <h2 id="resultText"></h2>
            <button onclick="closeResultModal()">确定</button>
        </div>
    </div>

    <div class="box">
        <div>你的筹码：<span id="myChip">1000</span>w | 对手筹码：<span id="enemyChip">1000</span>w | 底池：<span id="pool">200</span>w</div>
    </div>

    <div id="countdown"></div>
    <div style="margin:10px 0">
        <button id="readyBtn" onclick="playerReady()" disabled>准备</button>
    </div>

    <div class="box">
        <h3>你的手牌</h3>
        <div class="cardWrap" id="myCards"></div>
    </div>
    <div class="box">
        <h3>对手手牌</h3>
        <div class="cardWrap" id="enemyCards"></div>
    </div>

    <div>
        <input type="number" id="betInput" placeholder="输入下注数额">
        <button onclick="bet()">下注</button>
        <button onclick="fold()">弃牌</button>
        <button onclick="openCard()">开牌</button>
        <button onclick="resetGame()">重置游戏</button>
    </div>

    <button id="secretBtn" onclick="openPwdModal()">7</button>

    <div id="pwdModal" class="modal">
        <div class="modal-box">
            <h3>请输入后台密码</h3>
            <input type="password" id="pwdInput" placeholder="密码">
            <br>
            <button onclick="checkPassword()">确认</button>
            <button onclick="closePwdModal()">关闭</button>
        </div>
    </div>

    <div id="settingModal" class="modal">
        <div class="modal-box">
            <h3>⚙️ 后台全局配置</h3>
            <div>己方爆率(0~100)：<input type="number" id="pRate" min="0" max="100"></div>
            <div>对手爆率(0~100)：<input type="number" id="eRate" min="0" max="100"></div>
            <div>己方赔率：<input type="number" id="pOdds" step="0.1" min="0.1"></div>
            <div>对手赔率：<input type="number" id="eOdds" step="0.1" min="0.1"></div>
            <div>本局强制大牌(0关/1开)：<input type="number" id="forceBig" min="0" max="1"></div>
            <div>你的筹码：<input type="number" id="setMyChip"></div>
            <div>对手筹码：<input type="number" id="setEnemyChip"></div>
            <div>底池：<input type="number" id="setPool"></div>
            <br>
            <button onclick="saveSetting()">保存配置到服务端</button>
            <button onclick="closeSettingModal()">关闭</button>
        </div>
    </div>

<script>
const ADMIN_PASSWORD = "20090809qjc";
let ws;
let reconnectTimer = null;
const wsStatusDom = document.getElementById("wsStatus");
let myRole = "";
let gameState = {
    myChip:1000,
    enemyChip:1000,
    pool:200,
    myCards:[],
    enemyCards:[],
    showEnemyCard:false
};

function connectWebSocket(){
    try{
        ws = new WebSocket(location.origin.replace("https","wss"));
    }catch(e){
        console.error("创建连接失败",e);
        ws = null;
    }
    if(!ws) return;

    ws.onopen = ()=>{
        console.log("WebSocket连接成功");
        wsStatusDom.innerText = "🟢 服务已连接";
        document.getElementById("joinBtn").disabled = false;
        clearInterval(reconnectTimer);
        reconnectTimer=null;
    }
    ws.onclose = ()=>{
        wsStatusDom.innerText = "🔴 服务断开，正在重连...";
        document.getElementById("joinBtn").disabled = true;
        if(!reconnectTimer){
            reconnectTimer = setInterval(()=>{
                connectWebSocket();
            },3000)
        }
    }
    ws.onerror = err => {
        wsStatusDom.innerText = "🔴 连接出错";
        console.error("WS错误：",err);
    }
    ws.onmessage = function(evt){
        const msg = JSON.parse(evt.data);
        if(msg.type === "msg") alert(msg.text);

        if(msg.type === "loginSuccess"){
            myRole = msg.role;
            document.getElementById("selectModal").style.display = "none";
            document.getElementById("readyBtn").disabled = false;
        }
        if(msg.type === "countdownStart"){
            let num = 3;
            const dom = document.getElementById("countdown");
            dom.innerText = num;
            const timer = setInterval(()=>{
                num -=1;
                dom.innerText = num;
                if(num <=0){
                    clearInterval(timer);
                    dom.innerText = "";
                }
            },1000);
        }
        if(msg.type === "newCard"){
            gameState.myCards = msg.myCards;
            gameState.enemyCards = msg.enemyCards;
            gameState.showEnemyCard = false;
            render();
        }
        if(msg.type === "timerSync"){
            document.getElementById("countdown").innerText = `剩余 ${msg.time} 秒`;
        }
        if(msg.type === "syncState"){
            if(myRole === "A"){
                gameState.myChip = msg.chipA;
                gameState.enemyChip = msg.chipB;
            }else{
                gameState.myChip = msg.chipB;
                gameState.enemyChip = msg.chipA;
            }
            gameState.pool = msg.pool;
            render();
        }
        if(msg.type === "showAllCard"){
            gameState.showEnemyCard = true;
            render();
        }
        if(msg.type === "result"){
            document.getElementById("resultText").innerText = msg.msg;
            document.getElementById("resultModal").style.display = "flex";
        }
        if(msg.type === "reset"){
            if(myRole === "A"){
                gameState.myChip = msg.chipA;
                gameState.enemyChip = msg.chipB;
            }else{
                gameState.myChip = msg.chipB;
                gameState.enemyChip = msg.chipA;
            }
            gameState.pool = msg.pool;
            gameState.myCards=[];
            gameState.enemyCards=[];
            gameState.showEnemyCard=false;
            document.getElementById("readyBtn").innerText="准备";
            document.getElementById("readyBtn").disabled=false;
            document.getElementById("countdown").innerText="";
            render();
        }
    }
}
connectWebSocket();

function selectRole(){
    let inputVal = document.getElementById("roleInput").value.trim().toUpperCase();
    let targetRole;
    if(inputVal === "A" || inputVal === "1") targetRole = "A";
    else if(inputVal === "B" || inputVal === "2") targetRole = "B";
    else {
        alert("只能输入 A / B / 1 / 2");
        return;
    }
    if(ws.readyState !== WebSocket.OPEN){
        alert("⚠️ 等待服务器连接成功！");
        return;
    }
    ws.send(JSON.stringify({type:"login", name:targetRole, forceRole:targetRole}));
}
function closeResultModal(){document.getElementById("resultModal").style.display="none";}

function render(){
    document.getElementById("myChip").innerText = gameState.myChip;
    document.getElementById("enemyChip").innerText = gameState.enemyChip;
    document.getElementById("pool").innerText = gameState.pool;

    let myHtml = "";
    gameState.myCards.forEach(c=> myHtml += `<div class="card">${c}</div>`)
    document.getElementById("myCards").innerHTML = myHtml;

    let enemyHtml = "";
    if(gameState.showEnemyCard){
        gameState.enemyCards.forEach(c=> enemyHtml += `<div class="card">${c}</div>`)
    }else{
        gameState.enemyCards.forEach(()=> enemyHtml += `<div class="card card-back">?</div>`)
    }
}

function openPwdModal(){document.getElementById("pwdModal").style.display = "flex";}
