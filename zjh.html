<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联机炸金花</title>
    <style>
        * {box-sizing: border-box; font-family: sans-serif;}
        body {background: #182040; color:white; padding:16px; margin:0; position:relative;}
        .box {border:1px solid #778; border-radius:10px; padding:12px; margin-bottom:16px;}
        .cardWrap {display:flex; gap:8px; margin:10px 0;}
        .card {width:80px; height:110px; background:#223366; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:bold;}
        .card-back {background:#112244; color:transparent;} /*牌背面样式*/
        button {padding:14px 20px; font-size:17px; margin:4px; border:none; border-radius:6px; cursor:pointer;}
        input {padding:12px; font-size:17px; border-radius:6px; border:none; width:160px; margin:4px;}
        #countdown {font-size:48px; color:#ffcc00; text-align:center; font-weight:bold; margin:15px 0;}
        /*右上角7号按钮*/
        #secretBtn {
            position:fixed;
            right:12px;
            top:12px;
            width:42px;
            height:42px;
            border-radius:50%;
            font-size:22px;
            background:#334;
            color:#fff;
            border:1px solid #889;
        }
        /*密码弹窗面板*/
        .modal{
            display:none;
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.75);
            align-items:center;
            justify-content:center;
        }
        .modal-box{
            background:#222844;
            padding:20px;
            border-radius:10px;
        }
    </style>
</head>
<body>
    <h2>联机炸金花</h2>

    <div class="box">
        <div>你的筹码：<span id="myChip">1000w</span> | 对手筹码：<span id="enemyChip">1000w</span> | 底池：<span id="pool">200w</span></div>
    </div>

    <div id="countdown"></div>
    <div style="margin:10px 0">
        <button id="readyBtn" onclick="playerReady()">准备</button>
    </div>

    <div class="box">
        <h3>你的手牌</h3>
        <div class="cardWrap" id="myCards"></div>
    </div>
    <div class="box">
        <h3>对手手牌</h3>
        <div class="cardWrap" id="enemyCards"></div>
    </div>

    <div>
        <input type="number" id="betInput" placeholder="输入下注数额">
        <button onclick="bet()">下注</button>
        <button onclick="fold()">弃牌</button>
        <button onclick="openCard()">开牌</button>
        <button onclick="resetGame()">重置游戏</button>
    </div>

    <!-- 右上角秘密按钮【数字7】 -->
    <button id="secretBtn" onclick="openPwdModal()">7</button>

    <!-- 密码弹窗 -->
    <div id="pwdModal" class="modal">
        <div class="modal-box">
            <h3>请输入密码</h3>
            <input type="password" id="pwdInput" placeholder="密码">
            <br>
            <button onclick="checkPassword()">确认</button>
            <button onclick="closePwdModal()">关闭</button>
        </div>
    </div>

    <!-- 爆率+筹码设置面板，密码验证通过后才显示 -->
    <div id="settingModal" class="modal">
        <div class="modal-box">
            <h3>后台设置</h3>
            <div>己方爆率(0~100)：<input type="number" id="pRate" min="0" max="100"></div>
            <div>对手爆率(0~100)：<input type="number" id="eRate" min="0" max="100"></div>
            <div>本局强制大牌(0关/1开)：<input type="number" id="forceBig" min="0" max="1"></div>
            <div>你的筹码：<input type="number" id="setMyChip"></div>
            <div>对手筹码：<input type="number" id="setEnemyChip"></div>
            <div>底池：<input type="number" id="setPool"></div>
            <br>
            <button onclick="saveSetting()">保存</button>
            <button onclick="closeSettingModal()">关闭</button>
        </div>
    </div>

<script>
// 默认参数
let PLAYER_RATE = 100;
let ENEMY_RATE = 100;
let FORCE_BIG_CARD = 1;
const ADMIN_PASSWORD = "20090809qjc"; // 修改密码在这里

// WebSocket连接
const ws = new WebSocket(location.origin.replace("https","wss"));
let gameState = {
    myChip:1000,
    enemyChip:1000,
    pool:2000,
    myCards:[],
    enemyCards:[],
    showEnemyCard:false // 控制对手牌是否翻开
};
let readyState = {
    selfReady: false,
    enemyReady: false
};

// 渲染手牌
function render(){
    document.getElementById("myChip").innerText = gameState.myChip + "w";
    document.getElementById("enemyChip").innerText = gameState.enemyChip + "w";
    document.getElementById("pool").innerText = gameState.pool + "w";

    let myHtml = "";
    gameState.myCards.forEach(c=> myHtml += `<div class="card">${c}</div>`)
    document.getElementById("myCards").innerHTML = myHtml;

    let enemyHtml = "";
    if(gameState.showEnemyCard){
        gameState.enemyCards.forEach(c=> enemyHtml += `<div class="card">${c}</div>`)
    }else{
        //没开牌，全部显示背面
        gameState.enemyCards.forEach(()=> enemyHtml += `<div class="card card-back">?</div>`)
    }
    document.getElementById("enemyCards").innerHTML = enemyHtml;
}

// 打开密码弹窗
function openPwdModal(){
    document.getElementById("pwdModal").style.display = "flex";
}
function closePwdModal(){
    document.getElementById("pwdModal").style.display = "none";
    document.getElementById("pwdInput").value = "";
}
//校验密码
function checkPassword(){
    const inputPwd = document.getElementById("pwdInput").value;
    if(inputPwd === ADMIN_PASSWORD){
        closePwdModal();
        //填充当前数据到设置框
        document.getElementById("pRate").value = PLAYER_RATE;
        document.getElementById("eRate").value = ENEMY_RATE;
        document.getElementById("forceBig").value = FORCE_BIG_CARD;
        document.getElementById("setMyChip").value = gameState.myChip;
        document.getElementById("setEnemyChip").value = gameState.enemyChip;
        document.getElementById("setPool").value = gameState.pool;
        document.getElementById("settingModal").style.display = "flex";
    }else{
        alert("密码错误");
    }
}
function closeSettingModal(){
    document.getElementById("settingModal").style.display = "none";
}
//保存爆率筹码设置
function saveSetting(){
    PLAYER_RATE = Number(document.getElementById("pRate").value);
    ENEMY_RATE = Number(document.getElementById("eRate").value);
    FORCE_BIG_CARD = Number(document.getElementById("forceBig").value);
    gameState.myChip = Number(document.getElementById("setMyChip").value);
    gameState.enemyChip = Number(document.getElementById("setEnemyChip").value);
    gameState.pool = Number(document.getElementById("setPool").value);
    alert("保存成功");
    closeSettingModal();
    render();
}

// 玩家点准备
function playerReady(){
    readyState.selfReady = true;
    ws.send(JSON.stringify({type:"ready"}));
    document.getElementById("readyBtn").innerText = "已准备";
    document.getElementById("readyBtn").disabled = true;
}

// 下注【增加余额校验，防止负数】
function bet(){
    const val = Number(document.getElementById("betInput").value);
    if(!val || val <=0){
        alert("请输入有效的下注金额！");
        return;
    }
    if(val > gameState.myChip){
        alert("余额不足，无法下注！");
        return;
    }
    ws.send(JSON.stringify({type:"bet", num:val}));
}

function fold(){
    ws.send(JSON.stringify({type:"fold"}));
}
function openCard(){
    ws.send(JSON.stringify({type:"openCard"}));
}
function resetGame(){
    ws.send(JSON.stringify({type:"reset"}));
    readyState = {selfReady:false,enemyReady:false};
    document.getElementById("readyBtn").innerText = "准备";
    document.getElementById("readyBtn").disabled = false;
    document.getElementById("countdown").innerText = "";
}

// 接收服务器消息
ws.onmessage = function(evt){
    const msg = JSON.parse(evt.data);
    // 收到后端提示消息
    if(msg.type === "msg"){
        alert(msg.text);
    }
    // 双方准备完成，收到倒计时指令
    if(msg.type === "countdownStart"){
        startCountDown();
    }
    // 收到本局牌
    if(msg.type === "newCard"){
        gameState.myCards = msg.data.pCards;
        gameState.enemyCards = msg.data.eCards;
        gameState.showEnemyCard = false; // 新一局，对手牌盖着
        render();
    }
    //开牌，翻开对手手牌
    if(msg.type === "showAllCard"){
        gameState.showEnemyCard = true;
        render();
    }
    if(msg.type === "bet"){
        gameState.myChip -= msg.num;
        gameState.pool += msg.num;
        render();
    }
    if(msg.type === "reset"){
        gameState = {myChip:msg.myChip,enemyChip:msg.enemyChip,pool:msg.pool,myCards:[],enemyCards:[],showEnemyCard:false};
        readyState = {selfReady:false,enemyReady:false};
        document.getElementById("readyBtn").innerText = "准备";
        document.getElementById("readyBtn").disabled = false;
        document.getElementById("countdown").innerText = "";
        render();
    }
    if(msg.type === "gameResult"){
        alert(msg.msg);
    }
}

// 倒计时函数
function startCountDown(){
    let num = 3;
    const dom = document.getElementById("countdown");
    dom.innerText = num;
    const timer = setInterval(()=>{
        num -= 1;
        dom.innerText = num;
        if(num <=0){
            clearInterval(timer);
            dom.innerText = "开始发牌！";
        }
    },1000);
}

ws.onopen = ()=>console.log("连接成功");
render();
</script>
</body>
</html>
