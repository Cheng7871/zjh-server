<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCP‑Q7 炸金花</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#222738;color:#fff;padding:12px}
.card{width:90px;height:130px;background:#444;border-radius:8px;padding:8px;font-size:32px;text-align:center;display:inline-block;margin:4px}
.op-area{margin:20px 0}
input{padding:10px;font-size:16px;width:160px}
button{padding:10px 18px;font-size:16px;margin:4px;border:none;border-radius:6px;background:#3658d9;color:white}
.bottom-bar{display:flex;justify-content:space-around;margin-top:24px;padding:12px;background:#2c3146;border-radius:8px}
.modal{position:fixed;top:12px;right:12px;background:#2c3146;border-radius:10px;padding:20px;z-index:999;min-width:260px}
.admin-panel{display:none;background:#1e2233;padding:16px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<h2>TCP‑Q7</h2>
<div id="loginModal" class="modal">
<h3>登录</h3>
<p>输入1=玩家A，输入2=玩家B</p>
<input type="text" id="roleInput" placeholder="输入角色">
<button onclick="login()">进入游戏</button>
</div>

<div id="gameWrap" style="display:none">
<div>
<h4>你的手牌</h4>
<div id="myCards"></div>
</div>
<div style="margin-top:16px">
<h4>对手手牌</h4>
<div id="oppCards"></div>
</div>

<div class="op-area">
<input id="betInput" value="2000">
<button onclick="sendBet()">下注</button>
<button onclick="sendFold()">弃牌</button>
<button onclick="sendOpen()">开牌</button>
<button onclick="sendReset()">重置游戏</button>
<button onclick="openAdminInput()">后台设置</button>
</div>

<div class="admin-panel" id="adminPanel">
<h4>后台设置(房主)</h4>
<label>A爆率:<input id="rateA"></label><br>
<label>B爆率:<input id="rateB"></label><br>
<label>豹子:<input id="rateLeopard"></label><br>
<label>顺金:<input id="rateStraightFlush"></label><br>
<label>金花:<input id="rateFlush"></label><br>
<label>对子:<input id="ratePair"></label><br>
<button onclick="saveSetting()">保存配置</button>
</div>

<div id="msgBox"></div>

<div class="bottom-bar">
<div>玩家B筹码：<span id="chipB">0</span></div>
<div>底池：<span id="pot">0</span></div>
<div>玩家A筹码：<span id="chipA">0</span></div>
</div>
</div>

<script>
let ws;
let myRole=null;
//消息防抖时间戳
let lastSendTs = 0;
const DEBOUNCE = 600;

function login(){
    let r=document.getElementById("roleInput").value.trim();
    if(r!=='1'&&r!=='2')return alert('只能填1或者2');
    myRole = r==='1'?'A':'B';
    connectWs();
}

function connectWs(){
    ws=new WebSocket(`ws://${location.host}`);
    ws.onopen=()=>{
        ws.send(JSON.stringify({cmd:'login',role:myRole}));
    };
    ws.onmessage=(ev)=>{
        let pkg=JSON.parse(ev.data);
        handleMsg(pkg);
    };
    ws.onclose=()=>{
        appendMsg("连接断开，尝试重连...");
        setTimeout(connectWs,2500);
    }
}

function handleMsg(p){
    switch(p.cmd){
        case 'loginOk':
            document.getElementById("loginModal").style.display='none';
            document.getElementById("gameWrap").style.display='block';
            if(p.isHost) document.getElementById("adminPanel").style.display='block';
            break;
        case 'loginFail':
            alert(p.msg);break;
        case 'gameState':
            renderState(p.data);break;
        case 'notify':
            appendMsg(p.msg);break;
        case 'adminAuthOk':
            document.getElementById("adminPanel").style.display='block';break;
        case 'adminAuthFail':
            alert("密码错误");break;
        case 'hostOnly':
            alert("只有房主可以修改配置");break;
        case 'gameOver':
            appendMsg("游戏结束！"+p.winner+"获得最终胜利！");break;
    }
}

function renderState(s){
    document.getElementById("chipA").innerText = s.chipA;
    document.getElementById("chipB").innerText = s.chipB;
    document.getElementById("pot").innerText = s.pot;

    if(myRole==='A'){
        renderCards('myCards',s.myCardsA);
        renderCards('oppCards',s.myCardsB, !s.showAll);
    }else{
        renderCards('myCards',s.myCardsB);
        renderCards('oppCards',s.myCardsA, !s.showAll);
    }
}

function renderCards(domId,cards,isHide){
    const dom=document.getElementById(domId);
    dom.innerHTML="";
    if(!cards) return;
    if(isHide){
        for(let i=0;i<3;i++){
            dom.innerHTML += `<div class="card">?</div>`;
        }
        return;
    }
    cards.forEach(c=>{
        dom.innerHTML += `<div class="card">${c.suit} ${c.rank}</div>`;
    })
}

function appendMsg(txt){
    const box=document.getElementById("msgBox");
    box.innerHTML=`<div class="modal">${txt}</div>`;
    setTimeout(()=>{box.innerHTML=""},3500);
}

function openAdminInput(){
    let pwd=prompt("请输入后台密码");
    ws.send(JSON.stringify({cmd:"adminAuth",password:pwd}));
}

function saveSetting(){
    const payload={
        cmd:"saveRate",
        rateA:document.getElementById("rateA").value,
        rateB:document.getElementById("rateB").value,
        rateLeopard:document.getElementById("rateLeopard").value,
        rateStraightFlush:document.getElementById("rateStraightFlush").value,
        rateFlush:document.getElementById("rateFlush").value,
        ratePair:document.getElementById("ratePair").value
    }
    ws.send(JSON.stringify(payload));
}

//防抖发送
function safeSend(obj){
    const now = Date.now();
    if(now - lastSendTs < DEBOUNCE) return;
    lastSendTs = now;
    ws.send(JSON.stringify(obj));
}

function sendBet(){
    let val=parseInt(document.getElementById("betInput").value);
    safeSend({cmd:"bet",value:val});
}
function sendFold(){safeSend({cmd:"fold"});}
function sendOpen(){safeSend({cmd:"open"});}
function sendReset(){safeSend({cmd:"resetGame"});}
</script>
</body>
</html>
