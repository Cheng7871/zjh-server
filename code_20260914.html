<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2p炸金花-Quer7en</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #0f1424;
            color: #fff;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            margin-bottom:12px;
        }
        .box{
            background:#1a223a;
            border-radius:10px;
            padding:14px;
            margin-bottom:12px;
        }
        .card{
            width:80px;
            height:110px;
            background:#fff;
            color:#000;
            border-radius:8px;
            display:inline-flex;
            justify-content:center;
            align-items:center;
            font-size:32px;
            margin:4px;
        }
        .card-back{
            background:#25345e;
            color:#fff;
        }
        input{
            padding:10px;
            font-size:18px;
            width:100%;
            border-radius:8px;
            border:none;
            margin-bottom:8px;
        }
        button{
            padding:10px 14px;
            font-size:17px;
            border:none;
            border-radius:8px;
            background:#2b57cc;
            color:white;
            margin:4px;
        }
        button:disabled{
            background:#444c66;
        }
        .chip-row{
            display:flex;
            gap:8px;
            margin-top:10px;
        }
        .chip-item{
            flex:1;
            background:#1e2844;
            padding:10px;
            border-radius:8px;
            text-align:center;
        }
        .modal-mask{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.75);
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:999;
        }
        .modal-box{
            background:#1a223a;
            padding:24px;
            border-radius:12px;
            width:85%;
            max-width:360px;
        }

        /* ==========新增：右上角提示小方块 ========== */
        #toastArea {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 145px;
            max-height: 95px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .toast-item {
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            font-size: 12px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.45);
            text-align: center;
            box-shadow: 0 2px 8px #0006;
        }
        .toast-win {
            border-color: #ffd700;
            color: #ffe880;
        }
        .toast-wait {
            border-color: #68b8ff;
            color: #b6d9ff;
        }
    </style>
</head>
<body>
    <div id="gameContainer" style="position:relative;">
        <h1>2p炸金花-Quer7en</h1>
        <!-- 右上角提示容器，就是你要的小方块 -->
        <div id="toastArea"></div>

        <div class="box">
            <button id="btnDeclare">声明</button>
            <button id="btnReady" disabled>准备</button>
        </div>

        <div class="box">
            <div style="color:#ffcc00;font-size:16px;margin-bottom:8px;">你的手牌</div>
            <div id="myCards"></div>
        </div>

        <div class="box">
            <div style="color:#ffcc00;font-size:16px;margin-bottom:8px;">对手手牌</div>
            <div id="oppCards"></div>
        </div>

        <div class="box">
            <div style="color:#ffcc00;font-size:16px;margin-bottom:8px;">操作</div>
            <input type="number" id="betInput" placeholder="输入下注金额" value="100">
            <div>
                <button id="btnBet">下注</button>
                <button id="btnFold">弃牌</button>
            </div>
            <div>
                <button id="btnOpen">开牌</button>
                <button id="btnReset">重置游戏</button>
            </div>
        </div>

        <div class="chip-row">
            <div class="chip-item">
                <div>玩家A筹码</div>
                <div id="chipA" style="font-size:20px;color:#ffcc00">1000w</div>
            </div>
            <div class="chip-item">
                <div>底池</div>
                <div id="pool" style="font-size:20px;color:#ffcc00">200w</div>
            </div>
            <div class="chip-item">
                <div>玩家B筹码</div>
                <div id="chipB" style="font-size:20px;color:#ffcc00">1000w</div>
            </div>
        </div>
    </div>

    <!-- 登录弹窗保留（只有登录用，游戏胜负不再用这个弹窗） -->
    <div id="loginModal" class="modal-mask" style="display:flex;">
        <div class="modal-box">
            <h2 style="text-align:center;margin-bottom:16px;">输入数字进入游戏</h2>
            <p style="text-align:center;margin-bottom:12px;color:#aaccff;">玩家A填 1，玩家B填 2</p>
            <input type="text" id="loginInput" placeholder="输入1或者2">
            <button id="btnLogin" style="width:100%;">登录进入</button>
        </div>
    </div>

<script>
let ws;
let myRole = null;

// ==========新增：右上角提示函数，不再弹中间弹窗==========
function showToast(text, type = "") {
    const toastArea = document.getElementById("toastArea");
    if (!toastArea) return;
    const item = document.createElement("div");
    item.className = "toast-item " + type;
    item.textContent = text;
    toastArea.appendChild(item);
    setTimeout(() => {
        item.style.transition = "opacity 0.3s";
        item.style.opacity = "0";
        setTimeout(() => item.remove(), 300);
    }, 2000);
}

const elLoginModal = document.getElementById("loginModal");
const elLoginInput = document.getElementById("loginInput");
const elBtnLogin = document.getElementById("btnLogin");
const elBtnDeclare = document.getElementById("btnDeclare");
const elBtnReady = document.getElementById("btnReady");
const elMyCards = document.getElementById("myCards");
const elOppCards = document.getElementById("oppCards");
const elBetInput = document.getElementById("betInput");
const elBtnBet = document.getElementById("btnBet");
const elBtnFold = document.getElementById("btnFold");
const elBtnOpen = document.getElementById("btnOpen");
const elBtnReset = document.getElementById("btnReset");
const elChipA = document.getElementById("chipA");
const elChipB = document.getElementById("chipB");
const elPool = document.getElementById("pool");

function connectWs() {
    const wsUrl = window.location.protocol === "https:" ? "wss://" : "ws://" + window.location.host;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        console.log("websocket连接成功");
    };

    ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        switch(msg.type){
            case "loginFail":
                alert(msg.msg);
                break;
            case "loginSuccess":
                myRole = msg.role;
                elLoginModal.style.display = "none";
                break;
            case "gameState":
                elChipA.innerText = msg.state.chipA + "w";
                elChipB.innerText = msg.state.chipB + "w";
                elPool.innerText = msg.state.pool + "w";
                renderCards(msg.state.cardsA, msg.state.cardsB, msg.state.showEnemyCard);
                break;
            case "newRoundCards":
                renderCards(msg.cardsA, msg.cardsB, false);
                break;
            case "bothReady":
                showToast("双方已准备，开始对局", "toast-wait");
                break;
            case "roundEndSequence":
                showToast(msg.winner + "获胜", "toast-win");
                break;
            case "bothConfirmNext":
                showToast("双方确认，开启下一局", "toast-wait");
                break;
        }
    };

    ws.onclose = () => {
        console.log("连接断开，尝试重连");
        setTimeout(connectWs, 2000);
    };
}

function renderCards(cardsA, cardsB, showOpp){
    elMyCards.innerHTML = "";
    elOppCards.innerHTML = "";
    if(cardsA && cardsA.length>0){
        cardsA.forEach(c=>{
            const div = document.createElement("div");
            div.className = "card";
            div.innerText = c.suit + c.rank;
            elMyCards.appendChild(div);
        })
    }
    if(cardsB && cardsB.length>0){
        cardsB.forEach(c=>{
            const div = document.createElement("div");
            div.className = showOpp ? "card":"card card-back";
            div.innerText = showOpp ? (c.suit + c.rank) : "?";
            elOppCards.appendChild(div);
        })
    }
}

elBtnLogin.onclick = ()=>{
    const name = elLoginInput.value.trim();
    ws.send(JSON.stringify({type:"login", name:name}));
}

elBtnDeclare.onclick = ()=>{
    ws.send(JSON.stringify({type:"ready"}));
}

elBtnReady.onclick = ()=>{
    ws.send(JSON.stringify({type:"newRound"}));
}

elBtnBet.onclick = ()=>{
    const num = Number(elBetInput.value);
    ws.send(JSON.stringify({type:"bet", num:num}));
}

elBtnFold.onclick = ()=>{
    ws.send(JSON.stringify({type:"fold"}));
}

elBtnOpen.onclick = ()=>{
    ws.send(JSON.stringify({type:"openCard"}));
}

elBtnReset.onclick = ()=>{
    ws.send(JSON.stringify({type:"resetGame"}));
}

// 页面加载启动连接
connectWs();
</script>
</body>
</html>
