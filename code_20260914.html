<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2p炸金花-Quer7en</title>
</head>
<body>
<div>
    <div>
        <div>2p炸金花-Quer7en</div>
        <button id="settingBtn">7</button>
    </div>

    <!-- 登录弹窗 -->
    <div id="loginBox">
        <h2>输入数字进入游戏</h2>
        <p>玩家A填 1，玩家B填 2</p>
        <input type="text" id="roleInput" value="1">
        <br>
        <button id="loginBtn">登录进入</button>
    </div>

    <div id="gameBox">
        <div>
            <div>玩家A筹码：<span id="chipA">1000</span></div>
            <div>底池：<span id="pool">200</span></div>
            <div>玩家B筹码：<span id="chipB">1000</span></div>
        </div>

        <div>
            <h3>对手手牌</h3>
            <div id="enemyCards"></div>
        </div>
        <div>
            <h3>你的手牌</h3>
            <div id="myCards"></div>
        </div>

        <div>
            <button id="readyBtn">准备</button>
            <button id="betBtn">下注</button>
            <button id="foldBtn">弃牌</button>
            <button id="openBtn">开牌</button>
        </div>
    </div>

    <!-- 弹窗移到右上角，仅行内样式，无全局CSS -->
    <div id="resultPopup" style="position:fixed;top:12px;right:12px;display:none;border:1px solid #333;padding:12px;">
        <h2 id="popTitle">对局结束</h2>
        <p id="popMsg">胜利提示文字</p>
        <button id="nextRoundBtn">开启下一局</button>
    </div>
</div>

<script>
const ws = new WebSocket(location.origin.replace('http','ws'));

// 页面元素
const loginBox = document.getElementById('loginBox');
const gameBox = document.getElementById('gameBox');
const roleInput = document.getElementById('roleInput');
const loginBtn = document.getElementById('loginBtn');

const chipAEl = document.getElementById('chipA');
const chipBEl = document.getElementById('chipB');
const poolEl = document.getElementById('pool');
const myCardsEl = document.getElementById('myCards');
const enemyCardsEl = document.getElementById('enemyCards');

const readyBtn = document.getElementById('readyBtn');
const betBtn = document.getElementById('betBtn');
const foldBtn = document.getElementById('foldBtn');
const openBtn = document.getElementById('openBtn');

// 右上角弹窗元素
const resultPopup = document.getElementById('resultPopup');
const popTitle = document.getElementById('popTitle');
const popMsg = document.getElementById('popMsg');
const nextRoundBtn = document.getElementById('nextRoundBtn');

let myRole = null;

// 渲染手牌函数
function renderCardList(cardList, isEnemy = false){
    let html = '';
    cardList.forEach(card=>{
        if(isEnemy){
            html += `<div>?</div>`
        }else{
            html += `<div>${card.suit}${card.rank}</div>`
        }
    })
    return html;
}

// 更新游戏状态
function updateGame(state){
    chipAEl.innerText = state.chipA;
    chipBEl.innerText = state.chipB;
    poolEl.innerText = state.pool;

    if(myRole === "A"){
        myCardsEl.innerHTML = renderCardList(state.cardsA);
        enemyCardsEl.innerHTML = renderCardList(state.cardsB, true);
    }else{
        myCardsEl.innerHTML = renderCardList(state.cardsB);
        enemyCardsEl.innerHTML = renderCardList(state.cardsA, true);
    }
}

// 弹窗显示/隐藏
function showResultPopup(title, msg){
    popTitle.innerText = title;
    popMsg.innerText = msg;
    resultPopup.style.display = "block";
}
function hidePopup(){
    resultPopup.style.display = "none";
}

// WS消息接收
ws.onmessage = (ev)=>{
    const data = JSON.parse(ev.data);
    switch(data.type){
        case "loginFail":
            alert(data.msg);
            break;
        case "loginSuccess":
            myRole = data.role;
            loginBox.style.display = "none";
            gameBox.style.display = "block";
            break;
        case "gameState":
            updateGame(data.state);
            break;
        case "roundEndSequence":
            // 对局结束，右上角弹窗展示胜负
            showResultPopup("本局结束", `获胜者：${data.winner}`);
            break;
        case "newRoundCards":
            hidePopup();
            break;
    }
}

// 登录
loginBtn.onclick = ()=>{
    ws.send(JSON.stringify({
        type:"login",
        name:roleInput.value.trim()
    }))
}

readyBtn.onclick = ()=>{
    ws.send(JSON.stringify({type:"ready"}));
}
betBtn.onclick = ()=>{
    ws.send(JSON.stringify({type:"bet", num:100}));
}
foldBtn.onclick = ()=>{
    ws.send(JSON.stringify({type:"fold"}));
}
openBtn.onclick = ()=>{
    ws.send(JSON.stringify({type:"openCard"}));
}
nextRoundBtn.onclick = ()=>{
    ws.send(JSON.stringify({type:"requestNextRound"}));
}
</script>
</body>
</html>
