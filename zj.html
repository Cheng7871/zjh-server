<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>联机炸金花</title>
<style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body {
        background: #182040;
        color: #fff;
        padding: 12px;
        margin: 0;
        padding-bottom: 110px;
    }
    h2 {
        margin: 6px 0 10px;
        font-size: 20px;
    }
    .section {
        border: 1px solid #556;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        background: #1c2648;
    }
    .section-title {
        font-size: 15px;
        margin: 0 0 8px;
        color: #ffd000;
    }
    .card-row {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 100px;
    }
    .card {
        width: 70px;
        height: 95px;
        border-radius: 8px;
        background: #fff;
        color: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 800;
        box-shadow: 0 2px 6px rgba(0,0,0,.35);
        border: 1px solid #000;
    }
    .card .suit {
        font-size: 26px;
        line-height: 1;
    }
    .card .rank {
        font-size: 22px;
        line-height: 1;
        margin-top: 4px;
    }
    .card.red { color: #e50000; }
    .card.black { color: #111; }
    .card-back {
        background:
            repeating-linear-gradient(45deg, #0b2552, #0b2552 8px, #133572 8px, #133572 16px);
        color: #fff;
        border: 2px solid #224488;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 900;
    }
    button {
        padding: 11px 14px;
        font-size: 15px;
        margin: 4px 2px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        background: #2f4faf;
        color: #fff;
        font-weight: 700;
    }
    button:disabled {
        background: #444c68;
        color: #999;
        cursor: not-allowed;
    }
    input {
        padding: 11px;
        font-size: 15px;
        border-radius: 7px;
        border: none;
        width: 150px;
        margin: 4px 2px;
    }
    #countdown {
        font-size: 42px;
        color: #ffd000;
        text-align: center;
        margin: 12px 0;
        font-weight: 900;
    }
    #secretBtn {
        position: fixed;
        right: 12px;
        top: 12px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 18px;
        background: #334;
        color: #fff;
        border: 1px solid #888;
        padding: 0;
    }
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.78);
        align-items: center;
        justify-content: center;
        z-index: 99;
    }
    .modal-box {
        background: #222844;
        padding: 22px;
        border-radius: 12px;
        width: 86%;
        max-width: 340px;
        text-align: center;
        border: 1px solid #445;
    }
    #declText {
        width:100%;
        height:180px;
        border-radius:6px;
        padding:8px;
        font-size:14px;
        resize:none;
    }
    #loginModal { display: flex; }
    #chipBar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #121a36;
        border-top: 1px solid #445;
        padding: 12px;
        font-size: 14px;
        z-index: 5;
    }
    #chipBar .row {
        display: flex;
        justify-content: space-between;
        gap: 6px;
    }
    #chipBar .item {
        background: #1c2648;
        border-radius: 8px;
        padding: 8px;
        flex: 1;
        text-align: center;
    }
    #chipBar .label {
        color: #9fb3ff;
        font-size: 12px;
    }
    #chipBar .value {
        color: #ffd000;
        font-size: 18px;
        font-weight: 900;
    }
    h3 { margin: 8px 0; }
</style>
</head>
<body>
<h2>联机炸金花</h2>
<button onclick="openDeclModal()">声明</button>
<div id="declModal" class="modal">
    <div class="modal-box">
        <h3>声明</h3>
        <textarea id="declText" placeholder="在这里自定义输入你的文字内容"></textarea>
        <br><br>
        <button onclick="closeDeclModal()">关闭</button>
    </div>
</div>
<div id="loginModal" class="modal">
    <div class="modal-box">
        <h3>输入名字进入游戏</h3>
        <p style="font-size:14px;color:#9fb3ff">玩家A填 1，玩家B填 2</p>
        <input type="text" id="nameInput" placeholder="输入 1 或者 2" />
        <br><br>
        <button onclick="login()">登录进入</button>
    </div>
</div>
<!-- ==========修改：resultModal弹窗盒子行内样式，移右上角，其余全部不动========== -->
<div id="resultModal" class="modal">
    <div class="modal-box" style="position:absolute; top:12px; right:12px; transform:none;">
        <h2 id="resultText" style="color:#ffd000">玩家A获胜！</h2>
    </div>
</div>
<!-- ==========修改：nextModal弹窗盒子行内样式，移右上角========== -->
<div id="nextModal" class="modal">
    <div class="modal-box" style="position:absolute; top:12px; right:12px; transform:none;">
        <h3>本局结束</h3>
        <p>等待双方确认开启下一把</p>
        <button id="nextBtn" onclick="requestNextRound()">下一把</button>
    </div>
</div>
<!-- ==========修改：gameOverModal弹窗盒子行内样式，移右上角========== -->
<div id="gameOverModal" class="modal">
    <div class="modal-box" style="position:absolute; top:12px; right:12px; transform:none;">
        <h2 style="color:gold">🏆 游戏结束</h2>
        <h3 id="gameOverText"></h3>
        <button onclick="closeGameOverModal()">重新开局</button>
    </div>
</div>
<div id="timerModal" class="modal">
    <div class="modal-box">
        <h3>下一局即将开始</h3>
        <div id="timerNum" style="font-size:54px;color:gold;font-weight:900">3</div>
    </div>
</div>
<div id="countdown"></div>
<div style="margin:8px 0">
    <button id="readyBtn" onclick="playerReady()" disabled>准备</button>
</div>
<div class="section">
    <p class="section-title">你的手牌</p>
    <div class="card-row" id="myCardsBox"></div>
</div>
<div class="section">
    <p class="section-title">对手手牌</p>
    <div class="card-row" id="enemyCardsBox"></div>
</div>
<div class="section">
    <p class="section-title">操作</p>
    <input type="number" id="betInput" placeholder="输入下注数额" />
    <button onclick="bet()">下注</button>
    <button onclick="fold()">弃牌</button>
    <br>
    <button onclick="openCard()">开牌</button>
    <button onclick="resetGame()">重置游戏</button>
</div>
<button id="secretBtn" onclick="openPwdModal()">7</button>
<div id="pwdModal" class="modal">
    <div class="modal-box">
        <h3>请输入密码</h3>
        <input type="password" id="pwdInput" placeholder="密码" />
        <br><br>
        <button onclick="checkPassword()">确认</button>
        <button onclick="closePwdModal()">关闭</button>
    </div>
</div>
<div id="settingModal" class="modal">
    <div class="modal-box" style="text-align:left">
        <h3>后台设置</h3>
        <div>A爆率(0~100)：<input type="number" id="pRate" min="0" max="100"></div>
        <div>B爆率(0~100)：<input type="number" id="eRate" min="0" max="100"></div>
        <div>豹子%：<input type="number" id="rateBao" min="0" max="100"></div>
        <div>顺子%：<input type="number" id="rateShun" min="0" max="100"></div>
        <div>金花%：<input type="number" id="rateJin" min="0" max="100"></div>
        <div>天牌%：<input type="number" id="rateTian" min="0" max="100"></div>
        <div>玩家A筹码：<input type="number" id="setChipA"></div>
        <div>玩家B筹码：<input type="number" id="setChipB"></div>
        <div>底池：<input type="number" id="setPool"></div>
        <br>
        <button onclick="saveSetting()">保存同步给双方</button>
        <button onclick="closeSettingModal()">关闭</button>
    </div>
</div>
<div id="chipBar">
    <div class="row">
        <div class="item">
            <div class="label" id="selfLabel">玩家A筹码</div>
            <div class="value"><span id="myChip">1000</span>w</div>
        </div>
        <div class="item">
            <div class="label">底池</div>
            <div class="value"><span id="pool">200</span>w</div>
        </div>
        <div class="item">
            <div class="label" id="enemyLabel">玩家B筹码</div>
            <div class="value"><span id="enemyChip">1000</span>w</div>
        </div>
    </div>
</div>
<script>
let A_RATE = 100;
let B_RATE = 100;
let rateBao = 10;
let rateShun = 12;
let rateJin = 15;
let rateTian = 2;
const ADMIN_PASSWORD = "123456";
let timer1 = null;
let timer2 = null;
const ws = new WebSocket(location.origin.replace("https","wss"));
let myRole = "";
let gameState = {
    chipA: 1000,
    chipB: 1000,
    pool: 200,
    cardsA: [],
    cardsB: [],
    showEnemyCard: false,
    nextConfirmA: false,
    nextConfirmB: false,
    roundEnd: false
};
function openDeclModal(){
    document.getElementById("declModal").style.display = "flex";
}
function closeDeclModal(){
    document.getElementById("declModal").style.display = "none";
}
function createCardHtml(card, { hidden = false } = {}) {
    if (hidden) {
        return `<div class="card card-back">?</div>`;
    }
    const cls = (card.suit === "♥" || card.suit === "♦") ? "red" : "black";
    return `
        <div class="card ${cls}">
            <span class="suit">${card.suit}</span>
            <span class="rank">${card.rank}</span>
        </div>
    `;
}
function renderCards() {
    const myBox = document.getElementById("myCardsBox");
    const enemyBox = document.getElementById("enemyCardsBox");
    myBox.innerHTML = "";
    enemyBox.innerHTML = "";
    let myCards, enemyCards;
    if (myRole === "A") {
        myCards = gameState.cardsA || [];
        enemyCards = gameState.cardsB || [];
    } else {
        myCards = gameState.cardsB || [];
        enemyCards = gameState.cardsA || [];
    }
    if (myCards.length > 0) {
        myCards.forEach(card => {
            myBox.innerHTML += createCardHtml(card);
        });
    } else {
        myBox.innerHTML = `<div style="color:#888;font-size:14px">等待发牌...</div>`;
    }
    if (enemyCards.length > 0) {
        enemyCards.forEach(card => {
            enemyBox.innerHTML += createCardHtml(card, {
                hidden: !gameState.showEnemyCard
            });
        });
    } else {
        enemyBox.innerHTML = `<div style="color:#888;font-size:14px">等待发牌...</div>`;
    }
}
function render() {
    if (myRole === "A") {
        document.getElementById("selfLabel").innerText = "玩家A筹码";
        document.getElementById("enemyLabel").innerText = "玩家B筹码";
        document.getElementById("myChip").innerText = gameState.chipA;
        document.getElementById("enemyChip").innerText = gameState.chipB;
    } else {
        document.getElementById("selfLabel").innerText = "玩家B筹码";
        document.getElementById("enemyLabel").innerText = "玩家A筹码";
        document.getElementById("myChip").innerText = gameState.chipB;
        document.getElementById("enemyChip").innerText = gameState.chipA;
    }
    document.getElementById("pool").innerText = gameState.pool;
    renderCards();
}
function closeResultModal() {
    document.getElementById("resultModal").style.display = "none";
}
function closeNextModal() {
    document.getElementById("nextModal").style.display = "none";
    resetNextBtn();
}
function resetNextBtn(){
    const btn = document.getElementById("nextBtn");
    btn.disabled = false;
    btn.innerText = "下一把";
}
function resetReadyBtn(){
    const readyBtn = document.getElementById("readyBtn");
    readyBtn.disabled = false;
    readyBtn.innerText = "准备";
}
function closeGameOverModal() {
    document.getElementById("gameOverModal").style.display = "none";
    ws.send(JSON.stringify({ type: "fullResetGame" }));
}
function login() {
    const name = document.getElementById("nameInput").value.trim();
    ws.send(JSON.stringify({ type: "login", name: name }));
}
function playerReady() {
    ws.send(JSON.stringify({ type: "ready", role: myRole }));
    document.getElementById("readyBtn").innerText = "已准备";
    document.getElementById("readyBtn").disabled = true;
}
function start3sCountDown() {
    closeNextModal();
    const modal = document.getElementById("timerModal");
    const numDom = document.getElementById("timerNum");
    modal.style.display = "flex";
    let t = 3;
    numDom.innerText = t;
    const timer = setInterval(() => {
        t--;
        numDom.innerText = t;
        if (t <= 0) {
            clearInterval(timer);
            modal.style.display = "none";
            ws.send(JSON.stringify({ type: "newRound" }));
        }
    }, 1000);
}
function requestNextRound() {
    ws.send(JSON.stringify({ type: "requestNextRound", role: myRole }));
    const btn = document.getElementById("nextBtn");
    btn.disabled = true;
    btn.innerText = "等待对手...";
}
function bet() {
    const val = Number(document.getElementById("betInput").value);
    if (!val || val <= 0) {
        alert("请输入有效下注金额");
        return;
    }
    ws.send(JSON.stringify({ type: "bet", num: val, role: myRole }));
}
function fold() {
    ws.send(JSON.stringify({ type: "fold", role: myRole }));
}
function openCard() {
    ws.send(JSON.stringify({ type: "openCard", role: myRole }));
}
function resetGame() {
    ws.send(JSON.stringify({ type: "resetGame" }));
    resetReadyBtn();
}
function openPwdModal() {
    document.getElementById("pwdModal").style.display = "flex";
}
function closePwdModal() {
    document.getElementById("pwdModal").style.display = "none";
}
function openSettingModal() {
    document.getElementById("settingModal").style.display = "flex";
}
function closeSettingModal() {
    document.getElementById("settingModal").style.display = "none";
}
function checkPassword() {
    const pwd = document.getElementById("pwdInput").value.trim();
    if (pwd === ADMIN_PASSWORD) {
        closePwdModal();
        openSettingModal();
        document.getElementById("pRate").value = A_RATE;
        document.getElementById("eRate").value = B_RATE;
        document.getElementById("rateBao").value = rateBao;
        document.getElementById("rateShun").value = rateShun;
        document.getElementById("rateJin").value = rateJin;
        document.getElementById("rateTian").value = rateTian;
        document.getElementById("setChipA").value = gameState.chipA;
        document.getElementById("setChipB").value = gameState.chipB;
        document.getElementById("setPool").value = gameState.pool;
    } else {
        alert("密码错误");
    }
}
function saveSetting() {
    A_RATE = Number(document.getElementById("pRate").value);
    B_RATE = Number(document.getElementById("eRate").value);
    rateBao = Number(document.getElementById("rateBao").value);
    rateShun = Number(document.getElementById("rateShun").value);
    rateJin = Number(document.getElementById("rateJin").value);
    rateTian = Number(document.getElementById("rateTian").value);
    gameState.chipA = Number(document.getElementById("setChipA").value);
    gameState.chipB = Number(document.getElementById("setChipB").value);
    gameState.pool = Number(document.getElementById("setPool").value);
    ws.send(JSON.stringify({
        type: "updateAllSetting",
        A_RATE, B_RATE, rateBao, rateShun, rateJin, rateTian,
        chipA: gameState.chipA,
        chipB: gameState.chipB,
        pool: gameState.pool
    }));
    alert("已保存，同步全部玩家");
    closeSettingModal();
    render();
}
ws.onmessage = function (evt) {
    const msg = JSON.parse(evt.data);
    switch (msg.type) {
        case "loginSuccess":
            myRole = msg.role;
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("readyBtn").disabled = false;
            render();
            break;
        case "loginFail":
            alert(msg.msg);
            break;
        case "gameState":
            gameState = msg.state;
            render();
            break;
        case "bothReady":
            start3sCountDown();
            break;
        case "bothConfirmNext":
            closeNextModal();
            start3sCountDown();
            break;
        case "newRoundCards":
            gameState.cardsA = msg.cardsA;
            gameState.cardsB = msg.cardsB;
            gameState.showEnemyCard = false;
            resetNextBtn();
            render();
            break;
        case "roundEndSequence":
            if(timer1) clearTimeout(timer1);
            if(timer2) clearTimeout(timer2);
            resetNextBtn();
            gameState.showEnemyCard = true;
            render();
            const delayShowWin = 5000 + Math.floor(Math.random() * 2000);
            timer1 = setTimeout(() => {
                document.getElementById("resultText").innerText = msg.winner + "获胜！";
                document.getElementById("resultModal").style.display = "flex";
                timer2 = setTimeout(() => {
                    closeResultModal();
                    document.getElementById("nextModal").style.display = "flex";
                    render();
                }, 3000);
            }, delayShowWin);
            break;
        case "gameOver":
            document.getElementById("gameOverText").innerText = msg.winner + "赢得整场游戏！";
            document.getElementById("gameOverModal").style.display = "flex";
            break;
        case "syncAllSetting":
            A_RATE = msg.A_RATE;
            B_RATE = msg.B_RATE;
            rateBao = msg.rateBao;
            rateShun = msg.rateShun;
            rateJin = msg.rateJin;
            rateTian = msg.rateTian;
            gameState.chipA = msg.chipA;
            gameState.chipB = msg.chipB;
            gameState.pool = msg.pool;
            render();
            break;
    }
};
ws.onopen = () => console.log("连接成功");
</script>
</body>
</html>
